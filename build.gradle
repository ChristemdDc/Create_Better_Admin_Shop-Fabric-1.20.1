plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '1.0.21'
}

base {
    archivesName = archives_base_name
}

version = "$mod_version+$minecraft_version"
group = project.maven_group

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repositories {
    mavenCentral()
    mavenLocal()
    maven { url = 'https://maven.createmod.net' }              // Create + Ponder + Flywheel
    maven { url = 'https://maven.ithundxr.dev/snapshots' }     // Registrate
    maven { url = 'https://maven.parchmentmc.org' }
    maven { url = 'https://maven.blamejared.com' }             // JEI
    maven { url = 'https://maven.shedaniel.me/' }              // REI / Cloth
    maven { url = 'https://maven.terraformersmc.com/releases/' } // ModMenu / EMI
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://cursemaven.com' }
}

neoForge {
    version = project.neo_version

    // Parchment es opcional. Si la version cae 404, basta con cambiar
    // use_parchment=false en gradle.properties y vuelve a compilar.
    if (project.findProperty('use_parchment')?.toString()?.toBoolean()) {
        parchment {
            mappingsVersion = project.parchment_version
            minecraftVersion = project.parchment_minecraft_version
        }
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
        }
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
            programArguments.addAll '--mod', 'betteradminshop',
                    '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        betteradminshop {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // Create NeoForge 1.21.1.
    // El classifier :slim es OBLIGATORIO en NeoForge 1.21.1 — el jar default
    // lleva jarJar embebidos que rompen el dev runtime. Con :slim hay que
    // declarar Ponder/Flywheel/Registrate explicitamente (transitive = false).
    // Ver: https://wiki.createmod.net/developers/depend-on-create/neoforge-1.21.1
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") {
        transitive = false
    }
    implementation "net.createmod.ponder:ponder-neoforge:${ponder_version}"
    compileOnly    "dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}"
    runtimeOnly    "dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}"
    implementation "com.tterrag.registrate:Registrate:${registrate_version}"

    // SQLite JDBC – bundled inside the mod jar via JarJar
    jarJar(implementation("org.xerial:sqlite-jdbc:3.49.1.0"))

    // MongoDB sync driver (opcional, para registros externos / precios IA).
    // Bundled via JarJar. transitive=false: solo embebemos bson + core + sync;
    // las dependencias opcionales (snappy/zstd/jnr/mongocrypt) no hacen falta
    // para una conexión TCP básica sin compresión ni CSFLE.
    jarJar(implementation("org.mongodb:bson:5.2.1") { transitive = false })
    jarJar(implementation("org.mongodb:mongodb-driver-core:5.2.1") { transitive = false })
    jarJar(implementation("org.mongodb:mongodb-driver-sync:5.2.1") { transitive = false })
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

processResources {
    Map<String, Object> props = [
            mod_version            : project.mod_version,
            mod_version_full       : version,
            minecraft_version_range: project.minecraft_version_range,
            neo_version_range      : project.neo_version_range,
            loader_version_range   : project.loader_version_range,
            create_version_range   : project.create_version_range
    ]
    inputs.properties(props)
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand(props)
    }
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.archivesBaseName}" }
    }
}
