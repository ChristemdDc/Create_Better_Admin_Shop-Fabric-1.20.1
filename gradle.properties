org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# Mod Info
maven_group = com.example
archives_base_name = Betteradminshop
# Subir esta versión en CADA cambio que se publique, para no confundir builds.
mod_version = 0.2.1

# Minecraft / NeoForge
minecraft_version = 1.21.1
minecraft_version_range = [1.21.1,1.22)
neo_version = 21.1.169
neo_version_range = [21.1,)
loader_version_range = [4,)

# Parchment (1.21). Versiones publicadas reales en https://parchmentmc.org/docs/getting-started
# Si no necesitas nombres de parametros bonitos, pon use_parchment=false y se omite.
use_parchment = true
parchment_minecraft_version = 1.21
parchment_version = 2024.07.28

# Create NeoForge 1.21.1
# La version publicada en maven.createmod.net usa sufijo de build Jenkins
# (ej: 6.0.10-280). Ver https://maven.createmod.net/com/simibubi/create/create-1.21.1/
create_version = 6.0.10-280
# Para mods.toml (acepta cualquier 6.0.x)
create_version_range = [6.0.0,)

# Dependencias transitivas de Create (slim obliga a declararlas a mano)
ponder_version = 1.0.82+mc1.21.1
flywheel_version = 1.0.6
registrate_version = MC1.21-1.3.0+67
